# Default values for alkimi apps.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

## Image Info
image: repo/image
imageTag: 0.1.0

## Specify a imagePullPolicy
## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
imagePullPolicy: IfNotPresent

## Specify an array of imagePullSecrets.
## Secrets must be manually created in the namespace.
## ref: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
imagePullSecrets:

# Specify additional env variables
customEnv:

servicePort: 8082

## JVM Heap Option
heapOptions: "-Xms512M -Xmx512M"

configServer:

vault:

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

## Create HorizontalPodAutoscaler object for deployment type
#
autoscaling:
  enabled: false
#   minReplicas: 1
#   maxReplicas: 10
#   metrics:
#   - type: Resource
#     resource:
#       name: cpu
#       targetAverageUtilization: 60
#   - type: Resource
#     resource:
#       name: memory
#       targetAverageUtilization: 6

podDisruptionBudget:
  enabled: false
  policy:
    minAvailable: 1

## Node labels for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
nodeSelector: {}

## Taints to tolerate on node assignment:
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

## Pod scheduling constraints
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}


## Prometheus Exporter Configuration
## ref: https://prometheus.io/docs/instrumenting/exporters/
prometheus:
  serviceMonitor:
    enabled: false
    interval: "15s"

## External Access
## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
external:
  enabled: false
  type: LoadBalancer
  externalTrafficPolicy: Local
  portName: http
  port: 80

# Ingress
ingress:
  enabled: false
  #ingressClassName: nginx

livenessProbe:

readinessProbe:

startupProbe:

topologySpreadConstraints:
  enabled: false

# Define clusterName for additional label in multicluster evironments
#clusterName: default

# Ingress configuration for Google Cloud Provider ALB
gcp:
  managedCertificate:
    enabled: false
    #domain: foo.bar
  frontendConfig:
    enabled: false
    redirectToHttps: true
  backendConfig:
    enabled: false
    timeout: 30
    logging: false
  serviceAccountKey:
    enabled: false
    secretName: gcp-sa-key
    monthPath: /opt/gcp-sa-key.json
    subPath: gcp-sa-key.json