# Default values for custom application.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

## Image Info
image: repo/image
imageTag: 0.1.0

## Specify a imagePullPolicy
## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
imagePullPolicy: IfNotPresent

## Specify an array of imagePullSecrets.
## Secrets must be manually created in the namespace.
## ref: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
imagePullSecrets:

# Specify additional env variables
customEnv:
  HEAP_OPTS: "-Xms512M -Xmx512M"
  CONFIG_SERVER_URL: "http://config-server:8010"
  CONFIG_SERVER_PROFILE: "default"
  # GOOGLE_APPLICATION_CREDENTIALS: "/opt/gcp-sa-key.json"

service:
  ports:
    - name: "app-port"
      port: 8080
    # - name: "metrics-port"
    #   port: 8090
  # annotations:
  #   cloud.google.com/backend-config: '{"ports": {"8080": "gcp-alb-backend-config"}}'

serviceAccount: {}
  # name: custom-app-sa
  # create: true
  # annotations:
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::xxxxxxxxxxxx:role/eks-custom-application"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

## List of volumeMounts for application container
## ref: https://kubernetes.io/docs/concepts/storage/volumes/
volumeMounts:
  # - name: credentials
  #   mountPath: /etc/creds-volume
  # - name: gcp-sa-key
  #   mountPath: /opt/gcp-sa-key.json
  #   subPath: gcp-sa-key.json

## List of volumeMounts for application container
## ref: https://kubernetes.io/docs/concepts/storage/volumes/
volumes:
  # - name: credentials
  #   secret:
  #     secretName: creds
  # - name: gcp-sa-key
  #   secret:
  #     secretName: gcp-sa-key

## Create HorizontalPodAutoscaler object for deployment type
#
autoscaling:
  enabled: false
#   minReplicas: 1
#   maxReplicas: 10
#   metrics:
#   - type: Resource
#     resource:
#       name: cpu
#       targetAverageUtilization: 60
#   - type: Resource
#     resource:
#       name: memory
#       targetAverageUtilization: 6

podDisruptionBudget:
  enabled: false
  policy:
    minAvailable: 1

## Node labels for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
nodeSelector: {}

## Taints to tolerate on node assignment:
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

## Pod scheduling constraints
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}


## Prometheus Exporter Configuration
## ref: https://prometheus.io/docs/instrumenting/exporters/
prometheus:
  serviceMonitor:
    enabled: false
    interval: "15s"

## External Access
## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
external:
  enabled: false
  # annotations:
  type: LoadBalancer
  externalTrafficPolicy: Local
  portName: http
  port: 80

# Ingress
ingress:
  enabled: false
  # annotations:
  # ingressClassName: nginx
  # hosts:
  #   - host: foo.bar
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       serviceName: custom-app
  #       servicePort: 80

livenessProbe:

readinessProbe:

startupProbe:

topologySpreadConstraints:
  enabled: false

# Define clusterName for additional label in multicluster evironments
#clusterName: default

# Ingress configuration for Google Cloud Provider ALB
gcp:
  managedCertificate:
    enabled: false
    domain: foo.bar
  frontendConfig:
    enabled: false
    redirectToHttps: true
  backendConfig:
    enabled: false
    timeout: 30
    logging: false