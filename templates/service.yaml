apiVersion: v1
kind: Service
metadata:
  name: {{ include "custom-application.name" . }}
  labels:
{{ include "custom-application.labels" . | indent 4 }}
    {{- if .Values.service.additionalLabels }}
{{ toYaml .Values.service.additionalLabels | indent 4 }}
    {{- end }}
  annotations:
  {{- if .Values.service.annotations }}
    {{- with .Values.service.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ports:
{{ toYaml .Values.service.ports | indent 4 }}
  selector:
    app.kubernetes.io/name: {{ include "custom-application.name" . }}
