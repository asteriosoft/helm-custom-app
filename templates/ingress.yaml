{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "custom-application.ingress" . }}
  labels:
{{ include "custom-application.labels" . | indent 4 }}
  annotations:
    {{- if .Values.ingress.annotations }}
      {{- with .Values.ingress.annotations }}
        {{- toYaml . | nindent 4 }}
      {{- end }}
    {{- end }}
spec:
{{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
{{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "ImplementationSpecific" }}
            backend:
              service:
                name: {{ include "custom-application.name" $ }}
                port:
                  number: {{ .servicePort }}
          {{- end }}
    {{- end }}
  tls:
    {{- range .Values.ingress.hosts }}
      {{- if and .tls .tls.enabled }}
    - hosts:
        - {{ .host }}
      secretName: {{ .tls.secretName | default (printf "tls-%s" .host) | replace "." "-"  }}
      {{- end }}
    {{- end }}
{{- end }}
