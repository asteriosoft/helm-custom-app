{{- if .Values.external.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "custom-application.external-service" . }}
  {{- if .Values.external.annotations }}
  annotations:
  {{- range $key, $value := .Values.external.annotations }}
    {{ $key }}: "{{ $value }}"
  {{- end }}
  {{- end }}
  labels:
{{ include "custom-application.labels" . | indent 4 }}
spec:
  type: {{ .Values.external.type }}
  externalTrafficPolicy: {{ .Values.external.externalTrafficPolicy }}
  ports:
    {{- if .Values.external.enableHttp }}
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ .Values.external.targetPort }}
    {{- end }}
    - name: https
      protocol: TCP
      port: 443
      targetPort: {{ .Values.external.targetPort }}
  selector:
    app.kubernetes.io/name: {{ include "custom-application.name" . }}
{{- end }}
