{{- if .Values.gcp.backendConfig.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "custom-application.gcp-backend-config" . }}
spec:
  timeoutSec: {{ .Values.gcp.backendConfig.timeout }}
  logging:
    enable: {{ .Values.gcp.backendConfig.logging }}
{{- end }}