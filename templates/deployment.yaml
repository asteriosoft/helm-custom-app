apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "custom-application.name" . }}
  labels:
{{ include "custom-application.labels" . | indent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- with .Values.deploymentStrategy }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "custom-application.name" . }}
  template:
    metadata:
      labels:
{{ include "custom-application.podLabels" . | indent 8 }}
      {{- if or .Values.podAnnotations .Values.secrets.data }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.secrets.data }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
    {{- if .Values.serviceAccount.name }}
      serviceAccountName: "{{ .Values.serviceAccount.name }}"
    {{- end }}
    {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
    {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: {{ include "custom-application.name" . }}
          image: "{{ .Values.image }}:{{ .Values.imageTag }}"
          {{- if .Values.lifecycle }}
          lifecycle:
{{ toYaml .Values.lifecycle | indent 12 }}
          {{- end }}
          imagePullPolicy: "{{ .Values.imagePullPolicy }}"
          ports:
          {{- range $key, $value := .Values.service.ports }}
            - name: {{ $value.name }}
              containerPort: {{ $value.port }}
              protocol: TCP
          {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          {{- if .Values.volumeMounts }}
          volumeMounts:
{{ toYaml .Values.volumeMounts | indent 12 }}
          {{- end}}
          env:
            {{- range $key, $value := .Values.customEnv }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.customEnvValueFrom }}
{{ toYaml . | indent 12 }}
            {{- end }}
{{- if or .Values.customEnvFrom .Values.secrets.data }}
          envFrom:
          {{- if .Values.secrets.data }}
            - secretRef:
                name: {{ include "custom-application.name" . }}-secret
          {{- end }}
          {{- with .Values.customEnvFrom }}
{{ toYaml . | indent 12 }}
          {{- end }}
{{- end }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
{{ toYaml .Values.livenessProbe | trim | indent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
{{ toYaml .Values.readinessProbe | trim | indent 12 }}
          {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
{{ toYaml .Values.startupProbe | trim | indent 12 }}
          {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}
      {{- if .Values.volumes }}
      volumes:
{{ toYaml .Values.volumes | trim | indent 8 }}
      {{- end}}
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.policy }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "custom-application.name" . }}
          matchLabelKeys:
            - pod-template-hash
      {{- end }}
